{% extends 'base.html' %}
{% load static %}

{% block title %}Configurações de Mão de Obra{% endblock %}

{% block content %}
<section class="py-5 text-white" style="background-image: linear-gradient(rgba(13, 110, 253, 0.5), rgba(13, 110, 253, 0.5)), url('{% static 'images/aurora_coop_castro.jpg' %}'); background-size: cover; background-position: center;">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{% url 'home' %}" class="text-white">Home</a></li>

<section class="py-5">

                <p class="text-muted mb-0">Conteúdo em desenvolvimento.</p>

        </div>
